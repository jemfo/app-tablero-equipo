# Evita que Supabase TEST (plan free) se pause por inactividad (~7 días).
# Inicia sesión con un usuario de TEST y lee 1 fila de `trabajos`: es actividad real en la base.
# No toca PROD ni escribe nada.
# URL y anon key van acá a la vista: son públicas por diseño (la anon key no accede a nada sin login, RLS).
# Usuario y contraseña de TEST van en los secrets del repo TEST_USER_EMAIL / TEST_USER_PASSWORD.
# Supabase TEST vive en la cuenta laboral juan.olguin.vitolen@gmail.com.
name: Keep-alive Supabase TEST

on:
  schedule:
    - cron: '0 12 * * 1,4'   # lunes y jueves 12:00 UTC (09:00 AR)
  workflow_dispatch:          # para correrlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Login y lectura en TEST
        env:
          SB_URL: https://gdukaolvwgcykyjywyrx.supabase.co
          SB_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdkdWthb2x2d2djeWt5anl3eXJ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE0Njg3MTQsImV4cCI6MjA5NzA0NDcxNH0.oGit8s8ySOkowqrgetKlRilw6kI_lbe1NAcMsQbpJK8
          SB_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          SB_PASS: ${{ secrets.TEST_USER_PASSWORD }}
        run: |
          set -eu
          # Limpia espacios, saltos de línea y comillas que se cuelan al pegar el mail
          SB_EMAIL=$(printf '%s' "$SB_EMAIL" | tr -d " \t\r\n'\"\`")
          TOKEN=$(curl -sS --fail-with-body -X POST "$SB_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $SB_KEY" -H "Content-Type: application/json" \
            -d "{\"email\":\"$SB_EMAIL\",\"password\":\"$SB_PASS\"}" | jq -r '.access_token')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then echo "Login fallido en TEST (revisar TEST_USER_EMAIL / TEST_USER_PASSWORD)"; exit 1; fi
          curl -sS --fail-with-body "$SB_URL/rest/v1/trabajos?select=id&limit=1" \
            -H "apikey: $SB_KEY" -H "Authorization: Bearer $TOKEN" > /dev/null
          echo "TEST activo: $(date -u)"
